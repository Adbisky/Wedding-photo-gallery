<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasza Galeria Ślubna</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf6f0;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .audio-player {
            margin: 20px 0 40px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h1>Izabela &amp; Adrian - Nasz Ślub</h1>
    
    <div class="audio-player">
        <audio controls autoplay loop id="bg-audio">
            <source src="muzyka.mp3" type="audio/mpeg">
            Twoja przeglądarka nie wspiera odtwarzacza audio.
        </audio>
    </div>

    <div class="gallery">
        <img src="foto1.jpg" alt="Zdjęcie ślubne 1">
        <img src="foto2.jpg" alt="Zdjęcie ślubne 2">
        <img src="foto3.jpg" alt="Zdjęcie ślubne 3">
        <!-- Dodaj kolejne zdjęcia według tego samego schematu -->
    </div>

    <script>
        // Większość przeglądarek blokuje automatyczne odtwarzanie dźwięku bez interakcji użytkownika.
        // Poniższy kod uruchamia muzykę przy pierwszym kliknięciu w dowolnym miejscu na stronie.
        window.addEventListener('click', function() {
            var audio = document.getElementById('bg-audio');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>

</body>
</html>
