<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasza Galeria Ślubna</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf6f0;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .wedding-video {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 40px;
            overflow: hidden;
            border-radius: 8px;
        }

        .wedding-video video {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h1>Izabela &amp; Adrian - Nasz Ślub</h1>

    <div class="wedding-video">
        <video controls playsinline style="width: 100%; height: auto; max-width: 100%; display: block; object-fit: cover;">
            <source src="media/WeddingIzaAdrian.mp4" type="video/mp4">
            Twoja przeglądarka nie obsługuje odtwarzacza wideo.
        </video>
    </div>

    <div class="gallery">
        <img src="foto1.jpg" alt="Zdjęcie ślubne 1">
        <img src="foto2.jpg" alt="Zdjęcie ślubne 2">
        <img src="foto3.jpg" alt="Zdjęcie ślubne 3">
        <!-- Dodaj kolejne zdjęcia według tego samego schematu -->
    </div>

</body>
</html>
