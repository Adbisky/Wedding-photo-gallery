    <style>
        body {
            font-family: 'Pinyon Script', 'Monotype Corsiva', 'Apple Chancery', cursive;
            font-size: 200%;
            background-color: #faf6f0;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .page-header {
            position: relative;
            padding-top: 40px;
        }

        h1 {
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        h2 {
            font-weight: 400;
        }

        .original-photos-download {
            position: absolute;
            top: 0;
            right: 0;
            width: fit-content;
            margin: 0;
            padding: 10px 16px;
            border-radius: 4px;
            background: #e8dfd3;
            color: #4a4a4a;
            font-family: Verdana, sans-serif;
            font-size: 10px;
            font-weight: 400;
            text-decoration: none;
        }

        .original-photos-download:hover {
            background: #ddd1c1;
        }

        .wedding-video {
            width: 100%;
            max-width: 960px;
            margin: 0 auto 40px;
            overflow: hidden;
            border-radius: 8px;
        }

        .wedding-video video {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: zoom-in;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .gallery img:focus-visible {
            outline: 3px solid #4a4a4a;
            outline-offset: 3px;
        }

        .photo-lightbox {
            position: fixed;
            inset: 0;
            display: none;
            grid-template-areas:
                "close close close"
                "previous image next"
                "counter counter counter";
            grid-template-columns: 48px minmax(0, 1fr) 48px;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 12px;
            box-sizing: border-box;
            width: fit-content;
            height: fit-content;
            max-width: 94vw;
            max-height: 90vh;
            margin: auto;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #faf6f0;
            color: #4a4a4a;
        }

        .photo-lightbox[open] {
            display: grid;
        }

        .photo-lightbox::backdrop {
            background: rgba(0, 0, 0, 0.72);
        }

        .photo-lightbox img {
            grid-area: image;
            display: block;
            justify-self: center;
            align-self: center;
            border: 4px solid #faf6f0;
            max-width: min(72vw, 900px);
            max-height: 70vh;
            object-fit: contain;
            touch-action: pan-y;
        }

        .photo-lightbox button {
            padding: 8px 12px;
            border: 0;
            border-radius: 4px;
            background: #e8dfd3;
            color: #222;
            cursor: pointer;
            font: inherit;
        }

        .photo-lightbox .close-button {
            grid-area: close;
            justify-self: end;
        }

        .photo-lightbox .previous-button {
            grid-area: previous;
            align-self: center;
        }

        .photo-lightbox .next-button {
            grid-area: next;
            align-self: center;
        }

        .photo-lightbox .photo-counter {
            grid-area: counter;
            margin: 0;
        }

        @media (max-width: 600px) {
            .page-header {
                padding-top: 48px;
            }

            .original-photos-download {

            }

            .photo-lightbox {

            }

            .photo-lightbox img {
                max-width: 72vw;
                max-height: 62vh;
            }

            .photo-lightbox button {
                padding: 8px;
            }
        }
    </style>

    <dialog class="photo-lightbox" id="photo-lightbox" aria-label="Powiększone zdjęcie">
        <button class="close-button" type="button" aria-label="Zamknij powiększone zdjęcie">Zamknij</button>
        <button class="previous-button" type="button" aria-label="Poprzednie zdjęcie">‹</button>
        <img alt="">
        <button class="next-button" type="button" aria-label="Następne zdjęcie">›</button>
        <p class="photo-counter" aria-live="polite"></p>
    </dialog>

    <script>
        const galleries = document.querySelectorAll('.gallery');
        const galleryImages = Array.from(document.querySelectorAll('.gallery img'));
        const lightbox = document.querySelector('#photo-lightbox');
        const lightboxImage = lightbox.querySelector('img');
        const closeButton = lightbox.querySelector('button');
        const previousButton = lightbox.querySelector('.previous-button');
        const nextButton = lightbox.querySelector('.next-button');
        const photoCounter = lightbox.querySelector('.photo-counter');
        let currentPhotoIndex = 0;
        let touchStartX = 0;

        function showPhoto(index) {
            currentPhotoIndex = (index + galleryImages.length) % galleryImages.length;
            const image = galleryImages[currentPhotoIndex];
            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            photoCounter.textContent = `${currentPhotoIndex + 1} / ${galleryImages.length}`;
        }

        function openLightbox(index) {
            showPhoto(index);
            lightbox.showModal();
            closeButton.focus();
        }

        galleryImages.forEach((image, index) => {
            image.tabIndex = 0;
            image.setAttribute('role', 'button');
            image.setAttribute('aria-label', `Powiększ zdjęcie: ${image.alt}`);
            image.dataset.photoIndex = index;
        });

        galleries.forEach(gallery => {
            gallery.addEventListener('click', event => {
                const image = event.target.closest('img');
                if (image) openLightbox(Number(image.dataset.photoIndex));
            });

            gallery.addEventListener('keydown', event => {
                if (event.target.matches('img') && (event.key === 'Enter' || event.key === ' ')) {
                    event.preventDefault();
                    openLightbox(Number(event.target.dataset.photoIndex));
                }
            });
        });

        closeButton.addEventListener('click', () => lightbox.close());
        previousButton.addEventListener('click', () => showPhoto(currentPhotoIndex - 1));
        nextButton.addEventListener('click', () => showPhoto(currentPhotoIndex + 1));
        lightboxImage.addEventListener('touchstart', event => {
            touchStartX = event.changedTouches[0].screenX;
        }, { passive: true });
        lightboxImage.addEventListener('touchend', event => {
            const swipeDistance = event.changedTouches[0].screenX - touchStartX;
            if (Math.abs(swipeDistance) >= 50) {
                showPhoto(currentPhotoIndex + (swipeDistance < 0 ? 1 : -1));
            }
        }, { passive: true });
        lightbox.addEventListener('keydown', event => {
            if (event.key === 'ArrowLeft') {
                event.preventDefault();
                showPhoto(currentPhotoIndex - 1);
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                showPhoto(currentPhotoIndex + 1);
            }
        });
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) lightbox.close();
        });
    </script>

</body>
</html>
